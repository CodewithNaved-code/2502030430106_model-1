<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Iframe Examples</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        h2 { color: #333; }
        iframe { border: 2px solid #ddd; border-radius: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>📱 HTML Iframe Examples</h1>
    
    <h2>1. Google Map of Ahmedabad (Gujarat)</h2>
    <p>Interactive map embedded:</p>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3666.123456789!2d72.5714!3d23.0225!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e8507a2d5b9b7%3A0x9c8e6f5a2b3c4d1e!2sAhmedabad%2C%20Gujarat!5e0!3m2!1sen!2sin!4v1234567890" 
            width="600" height="450" 
            style="border:0;" allowfullscreen="" 
            loading="lazy" referrerpolicy="no-referrer-when-downgrade">
    </iframe>

    <h2>2. YouTube Video Embed</h2>
    <p>Programming tutorial video:</p>
    <iframe width="560" height="315" 
            src="https://www.youtube.com/embed/jV8B24rSN5o" 
            title="HTML Tutorial" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
    </iframe>

    <h2>3. External Website (W3Schools)</h2>
    <p>W3Schools HTML tutorial page:</p>
    <iframe src="https://www.w3schools.com/html/" 
            width="600" height="400" 
            frameborder="0">
    </iframe>

    <h2>4. Responsive Full-width Iframe</h2>
    <iframe src="https://www.geeksforgeeks.org/html-iframes/" 
            width="100%" height="500" 
            frameborder="0">
    </iframe>
</body>
</html>
