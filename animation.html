<!DOCTYPE html>
<html>
<head>
  <title>Gaming Style SVG Animation</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #0f0f0f, #000);
      font-family: Arial;
    }

    h2 {
      position: absolute;
      top: 20px;
      color: #161312;
      text-shadow: 0 0 10px #d81212;
    }

    svg {
      background: rgba(255,255,255,0.05);
      border: 2px solid #101010;
      border-radius: 15px;
      box-shadow: 0 0 25px #d03004;
    }

    /* Glow effect for face */
    .glow {
      filter: drop-shadow(0 0 10px #f03d06);
    }
  </style>
</head>

<body>

<h2>🔥 Gaming Cartoon Animation 🔥</h2>

<svg width="600" height="300">

  <g class="glow">

    <!-- Animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="400 0"
      dur="3s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.42 0 0.58 1" />

    <!-- Face -->
    <circle cx="100" cy="150" r="60" fill="#ffcc00" stroke="#00ffcc" stroke-width="4"/>

    <!-- Eyes -->
    <circle cx="80" cy="130" r="8" fill="#00ffcc"/>
    <circle cx="120" cy="130" r="8" fill="#00ffcc"/>

    <!-- Glow Smile -->
    <path d="M75 170 Q100 210 125 170"
          stroke="#ff00ff"
          stroke-width="4"
          fill="transparent"/>

  </g>

</svg>

</body>
</html>
